<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Products')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <h1 class="page-title">Products</h1>
    <section class="section">
        <div class="table-wrap" th:if="${!#lists.isEmpty(itemList)}">
            <table>
                <thead>
                <tr>
                    <th scope="col">Product</th>
                    <th scope="col">Price</th>
                    <th scope="col">Availability</th>
                    <th scope="col">Details</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${itemList}">
                    <td th:text="${item.commodityName}">Product name</td>
                    <td class="money" th:text="'$' + ${item.price}">$0</td>
                    <td>
                        <span class="status success" th:if="${item.availableStock > 0}"
                              th:text="${item.availableStock} + ' in stock'">In stock</span>
                        <span class="status error" th:unless="${item.availableStock > 0}">Sold out</span>
                    </td>
                    <td>
                        <a th:if="${item.commodityId != null}"
                           th:href="@{'/item/' + ${item.commodityId}}">View product</a>
                        <span class="muted" th:unless="${item.commodityId != null}">Unavailable</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <p class="empty" th:if="${#lists.isEmpty(itemList)}">No products found.</p>
    </section>
</main>
</body>
</html>
