<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('User')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <h1 class="page-title">User details</h1>
    <section class="panel narrow">
        <div class="table-wrap">
            <table class="details-table">
                <tbody>
                <tr><th scope="row">ID</th><td th:text="${user.id}">-</td></tr>
                <tr><th scope="row">Name</th><td th:text="${user.name}">-</td></tr>
                <tr><th scope="row">Age</th><td th:text="${user.age}">-</td></tr>
                <tr><th scope="row">Email</th><td th:text="${user.email}">-</td></tr>
                <tr><th scope="row">JWT</th><td th:text="${jwtToken}">-</td></tr>
                <tr><th scope="row">Decoded ID</th><td th:text="${jwtUserId}">-</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
