<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('User')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <div class="card narrow">
        <h1>User details</h1>
        <dl>
            <div class="kv"><dt>ID</dt><dd th:text="${user.id}">-</dd></div>
            <div class="kv"><dt>Name</dt><dd th:text="${user.name}">-</dd></div>
            <div class="kv"><dt>Age</dt><dd th:text="${user.age}">-</dd></div>
            <div class="kv"><dt>Email</dt><dd th:text="${user.email}">-</dd></div>
            <div class="kv"><dt>JWT</dt><dd th:text="${jwtToken}">-</dd></div>
            <div class="kv"><dt>Decoded ID</dt><dd th:text="${jwtUserId}">-</dd></div>
        </dl>
    </div>
</main>
</body>
</html>
