<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Online Shopping'">Online Shopping</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar" th:fragment="header">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/search}">Online Shopping</a>
        <nav class="nav">
            <a th:href="@{/search}">Shop</a>
            <a th:href="@{/addItem}">Add an item to sell</a>
        </nav>
        <form class="search" th:action="@{/search}" method="get">
            <input type="search" name="desc" placeholder="Search products">
            <button type="submit">Search</button>
        </form>
    </div>
</header>
</body>
</html>
