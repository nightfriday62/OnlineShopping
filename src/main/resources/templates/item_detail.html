<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Product')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <p><a th:href="@{/search}">&larr; Back to products</a></p>
    <div class="card detail" th:if="${commodity != null}">
        <div class="thumb large"
             th:style="'background:hsl(' + ${commodity.commodityId != null ? commodity.commodityId * 47 % 360 : 210} + ',70%,88%)'"
             th:text="${#strings.isEmpty(commodity.commodityName)} ? '?' : ${#strings.toUpperCase(#strings.substring(commodity.commodityName, 0, 1))}"></div>
        <div>
            <h1 th:text="${commodity.commodityName}">Name</h1>
            <p class="muted" th:text="${commodity.commodityDesc}">Description</p>
            <div class="price" style="font-size:1.8rem" th:text="'$' + ${commodity.price}">$0</div>
            <p>
                <span class="badge ok" th:if="${commodity.availableStock > 0}" th:text="${commodity.availableStock} + ' in stock'">In stock</span>
                <span class="badge bad" th:unless="${commodity.availableStock > 0}">Sold out</span>
            </p>
            <a class="btn" th:href="@{'/commodity/buy/1/' + ${commodity.commodityId}}">Buy now</a>
        </div>
    </div>
    <div class="card empty" th:if="${commodity == null}">Product not found.</div>
</main>
</body>
</html>
