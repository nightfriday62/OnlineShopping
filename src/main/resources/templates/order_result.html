<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <h1 class="page-title" th:text="${orderNo != null} ? 'Order placed' : 'Order failed'">Order</h1>
    <section class="panel narrow center">
        <p th:text="${resultInfo}">Result</p>
        <div class="section">
            <div class="actions">
                <a class="button" th:if="${orderNo != null}" th:href="@{'/commodity/orderQuery/' + ${orderNo}}">View order</a>
                <a class="button secondary" th:href="@{/search}">Back to products</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
