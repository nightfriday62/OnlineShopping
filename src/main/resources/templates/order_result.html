<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <div class="card narrow center">
        <h1 th:text="${orderNo != null} ? 'Order placed' : 'Order failed'">Order</h1>
        <p th:text="${resultInfo}">Result</p>
        <div class="actions" style="justify-content:center">
            <a class="btn" th:if="${orderNo != null}" th:href="@{'/commodity/orderQuery/' + ${orderNo}}">View order</a>
            <a class="btn secondary" th:href="@{/search}">Back to products</a>
        </div>
    </div>
</main>
</body>
</html>
