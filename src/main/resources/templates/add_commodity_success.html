<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Item added')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <h1 class="page-title">Item added</h1>
    <section class="panel narrow">
        <div class="table-wrap">
            <table class="details-table">
                <tbody>
                <tr><th scope="row">Name</th><td th:text="${abc.commodityName}">Name</td></tr>
                <tr><th scope="row">Description</th><td th:text="${abc.commodityDesc}">Description</td></tr>
                <tr><th scope="row">Price</th><td class="money" th:text="'$' + ${abc.price}">$0</td></tr>
                <tr><th scope="row">Stock</th><td th:text="${abc.availableStock}">0</td></tr>
                <tr><th scope="row">Seller ID</th><td th:text="${abc.creatorUserId}">0</td></tr>
                </tbody>
            </table>
        </div>
        <div class="actions">
            <a class="button" th:href="@{/addItem}">Add another item</a>
            <a class="button secondary" th:href="@{/search}">View products</a>
        </div>
    </section>
</main>
</body>
</html>
