<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Item added')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <div class="card narrow">
        <h1>Item added</h1>
        <dl>
            <div class="kv"><dt>Name</dt><dd th:text="${abc.commodityName}">Name</dd></div>
            <div class="kv"><dt>Description</dt><dd th:text="${abc.commodityDesc}">Description</dd></div>
            <div class="kv"><dt>Price</dt><dd th:text="'$' + ${abc.price}">$0</dd></div>
            <div class="kv"><dt>Stock</dt><dd th:text="${abc.availableStock}">0</dd></div>
            <div class="kv"><dt>Seller ID</dt><dd th:text="${abc.creatorUserId}">0</dd></div>
        </dl>
        <div class="actions">
            <a class="btn" th:href="@{/addItem}">Add another</a>
            <a class="btn secondary" th:href="@{/search}">View products</a>
        </div>
    </div>
</main>
</body>
</html>
