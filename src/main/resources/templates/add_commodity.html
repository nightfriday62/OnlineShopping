<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sell an item')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main class="container">
    <div class="card narrow">
        <h1>Sell an item</h1>
        <form th:action="@{/commodities}" method="post">
            <label for="commodityName">Name</label>
            <input type="text" id="commodityName" name="commodityName" required>
            <label for="commodityDesc">Description</label>
            <input type="text" id="commodityDesc" name="commodityDesc" required>
            <label for="price">Price ($)</label>
            <input type="number" id="price" name="price" min="0" step="1" required>
            <label for="availableStock">Stock</label>
            <input type="number" id="availableStock" name="availableStock" min="0" step="1" required>
            <label for="creatorUserId">Seller ID</label>
            <input type="number" id="creatorUserId" name="creatorUserId" min="0" step="1" required>
            <button type="submit" class="btn block">Add item</button>
        </form>
    </div>
</main>
</body>
</html>
