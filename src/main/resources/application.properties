spring.application.name=OnlineShopping
server.port=8080
spring.main.allow-bean-definition-overriding=true
security.jwt.secret-key=ZnJlbmNoLWlzLWhhcmQtdG8tbGVhcm4tY2VzdC10cm9wLWRpZmZpY2eesfT
security.jwt.token-validity-in-milliseconds=3600000
# Configuring DataSource Drivers
spring.datasource.driver-class-name=org.apache.shardingsphere.driver.ShardingSphereDriver
# Specify a YAML configuration file
spring.datasource.url=jdbc:shardingsphere:classpath:shardingSphereConfig.yaml?placeholder-type=environment
#spring.sql.init.mode=never
#spring.config.import=classpath:shardingSphereConfig.yaml

# myBatis mapper configuration
mybatis.mapper-locations=classpath:mappers/*.xml

# Redis configuration
# spring.redis.database=0
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.pool.max-active=200
spring.redis.pool.max-wait=-1
spring.redis.pool.max-idle=8
spring.redis.pool.min-idle=0
# spring.redis.timeout=0
spring.session.store-type=none

#  RocketMQ configuration
rocketmq.producer.group=orderGroup
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:localhost:9876}

# Elasticsearch configuration
spring.elasticsearch.host=${ES_HOST:localhost}
spring.elasticsearch.port=${ES_PORT:9200}
spring.elasticsearch.api-key=${ES_API_KEY:}
spring.elasticsearch.api-key-parameter=${ES_API_KEY_PARAMETER:/online-shopping/es/api-key}

# Snowflake configuration
snowflake.worker-id=${SNOWFLAKE_WORKER_ID:1}